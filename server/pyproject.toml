[project]
name = "twinfix"
version = "0.1.0"
description = "AI agent that diagnoses and fixes bugs inside an ephemeral twin environment"
authors = [{ name = "TwinFix contributors" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy[asyncio]==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
    "psycopg-pool==3.3.3",
    "langgraph==1.2.20",
    "langgraph-checkpoint-postgres==3.2.0",
    "aio-pika==10.2.3",
    "redis==8.1.0",
    "httpx==0.28.1",
    "sse-starlette==3.7.0",
    "pyjwt==2.15.1",
    "cryptography==50.0.2",
    "markdown-it-py==4.2.0",
    "docker==7.2.0",
    "pyyaml==6.0.3",
    "tree-sitter==0.26.1",
    "tree-sitter-java==0.23.5",
    "tree-sitter-python==0.25.0",
    "tree-sitter-go==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-c-sharp==0.23.5",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[project.optional-dependencies]
# 评测镜像需要 pytest：控制台发起的评测在 API 容器内跑 `twinfix-arena`，Python 用例靠它判分
eval = ["pytest==9.2.0"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "aiosmtpd==1.4.6",
    "types-pyyaml==6.0.12.20261103",
]

[project.scripts]
twinfix-worker = "twinfix.worker.main:main"
twinfix-arena = "twinfix.arena.cli:main"
twinfix-user = "twinfix.usercli:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twinfix"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM"]
ignore = [
    "S101",   # assert is fine in tests and invariants
    "RUF001", # Chinese punctuation in strings is intentional
    "RUF002",
    "RUF003",
    "ASYNC109", # timeout 参数是适配器契约的一部分（转交给沙箱/Docker），不是 asyncio 超时
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["aio_pika.*", "sse_starlette.*", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs postgres/redis/rabbitmq from deploy/compose.dev.yml"]

# 国内网络下 PyPI 不稳定：默认走阿里云镜像（可用 UV_DEFAULT_INDEX 覆盖）
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
