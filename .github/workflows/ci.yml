name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: twinfix
          POSTGRES_PASSWORD: twinfix
          POSTGRES_DB: twinfix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U twinfix" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy twinfix
      - run: uv run pytest -q
        env:
          TWINFIX_TEST_DATABASE_URL: postgresql+psycopg://twinfix:twinfix@127.0.0.1:5432/twinfix_test

  arena:
    # 每个故障用例：注入后 CI 仍绿、隐藏测试能抓住 bug、参考修复能通过
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: arena/demo-shop/**/pom.xml
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - run: uv sync --frozen --python 3.12
        working-directory: server
      - run: uv run twinfix-arena validate
        working-directory: server

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
