name: Feature request
description: 提议新能力或改进
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到什么困难
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为、接口或配置
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 取舍
      description: 是否考虑过其他做法？对安全边界、成本、兼容性的影响
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - Server / orchestrator
        - Agent / prompt
        - Tool gateway / sandbox
        - Twin environment
        - Language profile
        - Code host / CI
        - Web console
        - Arena / eval
        - Docs / deploy
