# demo-ts 孪生环境模板。ComposeTwinProvider 为每个事故用独立项目名启动一份：
#   COMPOSE_PROJECT_NAME=twinfix-<id>  PORT_BASE=<端口段起点>  构建上下文 = 修复分支源码
# 单服务、无外部依赖：Node 22 直接执行 TypeScript，构建过程不需要联网。
services:
  orders:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: Dockerfile.service
    environment:
      PORT: "8080"
    ports: ["127.0.0.1:${PORT_ORDERS}:8080"]
    mem_limit: ${TWIN_SERVICE_MEM_LIMIT:-512m}
    cpus: ${TWIN_SERVICE_CPUS:-1.0}
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/actuator/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 60
