id: G001
title: 无券下单 nil pointer panic（判空写在解引用之后）
category: 空指针
description: >
  有人给满减券加了"门槛至少为券面值 2 倍"的兜底逻辑，把 c.threshold(coupon) 挪到了
  coupon == nil 判断之前。Go 里解引用 nil 指针会直接 panic，所有不带优惠券的订单都返回 500。
  同一提交删掉了覆盖无券场景的单测，CI 因此是绿的。
language: go
seed: demo-go
project_config:
  project_packages: [example.com/demo-go]
  twin:
    directory: arena/demo-go/twin
    services: [orders]
inject:
  type: patch
  file: inject.patch
  branch: dev
  message: "refactor(orders): simplify coupon threshold lookup"
  services: [orders]
signal:
  title: "POST /api/orders 500: panic: runtime error: invalid memory address or nil pointer dereference"
  service: orders
  env: test
  severity: S2
  stacktrace: |
    panic: runtime error: invalid memory address or nil pointer dereference
    [signal SIGSEGV: segmentation violation code=0x1 addr=0x8 pc=0x5b8f21]

    goroutine 20 [running]:
    example.com/demo-go/orders.PriceCalculator.threshold(0x0)
        example.com/demo-go/orders/pricing.go:49 +0x2d
    example.com/demo-go/orders.PriceCalculator.DiscountFor(...)
        example.com/demo-go/orders/pricing.go:22 +0x45
    example.com/demo-go/orders.PriceCalculator.Calculate(...)
        example.com/demo-go/orders/pricing.go:14 +0x9c
    example.com/demo-go/orders.(*OrderService).Create(...)
        example.com/demo-go/orders/service.go:31 +0x2a8
    example.com/demo-go/orders.(*Server).handleOrders.func1(...)
        example.com/demo-go/orders/app.go:91 +0x1e5
    net/http.HandlerFunc.ServeHTTP(...)
        /usr/local/go/src/net/http/server.go:2136 +0x29
expect:
  outcome: fixed
  root_cause_locations: ["orders/pricing.go#DiscountFor", "orders/pricing.go#threshold"]
  root_cause_keywords: ["nil", "coupon", "判空", "panic", "threshold"]
# 隐藏测试：无券定价（修复前失败）+ 门槛边界与百分比券（防止"删掉兜底逻辑"之类的过度修复）
hidden_tests: [hidden/pricing_hidden_test.go]
