# demo-shop 孪生环境模板。ComposeTwinProvider 为每个事故用独立项目名启动一份：
#   COMPOSE_PROJECT_NAME=twinfix-<id>  PORT_BASE=<端口段起点>  构建上下文 = 修复分支源码
# 隔离：独立网络、独立数据库（种子数据）、无外部依赖；只暴露 order / inventory 两个端口到 127.0.0.1。
services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    tmpfs: [/var/lib/postgresql/data]
    mem_limit: ${TWIN_DB_MEM_LIMIT:-256m}
    cpus: 0.5
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  inventory:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: Dockerfile.service
      args: { MODULE: inventory }
    labels:
      dev.twinfix.metrics: "8080"   # 可观测栈的 Prometheus 按此标签抓取 /actuator/prometheus
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://db:5432/shop
      SPRING_PROFILES_ACTIVE: twin
    ports: ["127.0.0.1:${PORT_INVENTORY}:8080"]
    mem_limit: ${TWIN_SERVICE_MEM_LIMIT:-768m}
    cpus: ${TWIN_SERVICE_CPUS:-1.0}
    pids_limit: 512
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 3s
      retries: 60

  order:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: Dockerfile.service
      args: { MODULE: order }
    labels:
      dev.twinfix.metrics: "8080"   # 可观测栈的 Prometheus 按此标签抓取 /actuator/prometheus
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://db:5432/shop
      INVENTORY_URL: http://inventory:8080
      SPRING_PROFILES_ACTIVE: twin
    ports: ["127.0.0.1:${PORT_ORDER}:8080"]
    mem_limit: ${TWIN_SERVICE_MEM_LIMIT:-768m}
    cpus: ${TWIN_SERVICE_CPUS:-1.0}
    pids_limit: 512
    depends_on:
      db: { condition: service_healthy }
      inventory: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 3s
      retries: 60
